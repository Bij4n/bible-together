# Curated passages for Highlighted in Red.
#
# kind: parable       a story or comparison Jesus tells
#       word_picture  an image he uses for himself in John's gospel,
#                     which has no parables in the usual sense
#
# Each passage is listed once, with every gospel that tells it. An
# appearance is Book.chapter.verses and must stay inside one chapter.
# The order here is the order the site lists them in: Matthew's order,
# then the parables only Mark has, then Luke's.

